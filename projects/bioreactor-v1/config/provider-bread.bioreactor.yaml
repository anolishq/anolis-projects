provider:
  name: bread0

hardware:
  # A real path opens a live CRUMBS session; a mock:// path would seed an
  # inventory instead. If the host cannot serve the bus (a requirement below is
  # unmet, or the bus will not open), bread >= 0.5.0 stays up with no devices
  # and reports why in provider health instead of exiting.
  bus_path: /dev/i2c-1
  query_delay_us: 15000
  timeout_ms: 150
  retry_count: 3
  # The gen1 AVR slices on a Pi 4 lose retried writes at 98 kHz and corrupt
  # reads at 66-79 kHz; 49.7 kHz is clean (feastorg/CRUMBS#97). bread's
  # --check-host and startup compare this with the bus's configured clock;
  # host/prep-raspberrypi-os.sh sets it.
  max_bus_hz: 50000

discovery:
  mode: manual
  addresses: [0x0A, 0x14, 0x15]

devices:
  - id: rlht0
    type: rlht
    label: Reactor Temperature Node
    address: 0x0A
    command_watchdog_ms: 5000
  - id: dcmt0
    type: dcmt
    label: Reactor Sampling + Stirring (ch1 sample, ch2 stir)
    address: 0x14
    # Firmware command watchdog (bread >=0.3.5 + DCMT firmware with
    # CMD_WATCHDOG caps): auto-brake if the bus goes silent this long.
    # The provider skips arming (with a warning) on older firmware.
    command_watchdog_ms: 5000
  - id: dcmt1
    type: dcmt
    label: Reactor Dual Dosing (ch1 dose1, ch2 dose2)
    address: 0x15
    command_watchdog_ms: 5000
