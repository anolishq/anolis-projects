# anolis-provider-adafruit: the room-air BME280 beside the vessel, on the
# same I2C bus as the CRUMBS slices and the EZO circuits (/dev/i2c-1). It
# measures what the heater loses heat to: room temperature sets how far the
# liquid sits below the heater pad (docs/runbook.md, "Choosing the pad
# setpoint"), and the pressure is what the DO probe compensates for.
# The breakout answers at 0x76; the provider's default is 0x77.
i2c_bus: 1
devices:
  - id: room0
    type: bme280
    label: Room air
    address: 0x76
