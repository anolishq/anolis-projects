runtime:
  name: bioreactor-full
  shutdown_timeout_ms: 3000
  startup_timeout_ms: 30000

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false

providers:
  - id: bread0
    command: ../anolis-provider-bread/build/dev-release/anolis-provider-bread
    args: ["--config", "../anolis-projects/projects/bioreactor-v1/config/provider-bread.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 2000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

  - id: ezo0
    command: ../anolis-provider-ezo/build/dev-linux-hardware-release/anolis-provider-ezo
    args: ["--config", "../anolis-projects/projects/bioreactor-v1/config/provider-ezo.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 5000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

polling:
  interval_ms: 2500

telemetry:
  enabled: true
  # Token via INFLUXDB_TOKEN env (/etc/anolis/runtime.env), not this file.
  influxdb:
    url: http://localhost:8086
    org: anolis
    bucket: anolis
    batch_size: 100
    flush_interval_ms: 1000

automation:
  enabled: true
  behavior_tree: ../anolis-projects/projects/bioreactor-v1/behaviors/bioreactor_stir_dual_dosing.xml
  tick_rate_hz: 2
  manual_gating_policy: BLOCK
  parameters:
    - name: impeller_enable
      type: bool
      default: false
    - name: impeller_pwm
      type: int64
      default: 255
      min: 0
      max: 255
    - name: dose1_enable
      type: bool
      default: false
    - name: dose1_pwm
      type: int64
      default: 240
      min: 0
      max: 255
    - name: dose1_startup_delay_s
      type: int64
      default: 60
      min: 0
      max: 3600
    - name: dose1_interval_s
      type: int64
      default: 900
      min: 1
      max: 86400
    - name: dose1_pulse_s
      type: int64
      default: 5
      min: 1
      max: 3600
    - name: dose1_max_pulses_per_hour
      type: int64
      default: 0
      min: 0
      max: 3600
    - name: dose2_enable
      type: bool
      default: false
    - name: dose2_pwm
      type: int64
      default: 240
      min: 0
      max: 255
    - name: dose2_startup_delay_s
      type: int64
      default: 60
      min: 0
      max: 3600
    - name: dose2_interval_s
      type: int64
      default: 900
      min: 1
      max: 86400
    - name: dose2_pulse_s
      type: int64
      default: 5
      min: 1
      max: 3600
    - name: dose2_max_pulses_per_hour
      type: int64
      default: 0
      min: 0
      max: 3600
    - name: command_keepalive_s
      type: int64
      default: 30
      min: 0
      max: 3600
    - name: command_min_spacing_ms
      type: int64
      default: 500
      min: 0
      max: 600000
  mode_transition_hooks:
    before_transition:
      - from: AUTO
        to: MANUAL
        fail_on_error: true
        calls:
          - device_handle: bread0/dcmt0
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt0
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0
          - device_handle: bread0/dcmt1
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt1
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0
      - from: MANUAL
        to: IDLE
        fail_on_error: true
        calls:
          - device_handle: bread0/dcmt0
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt0
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0
          - device_handle: bread0/dcmt1
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt1
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0
      - from: "*"
        to: FAULT
        # FAULT is fail-safe: best-effort output writes, never block FAULT entry.
        fail_on_error: false
        calls:
          - device_handle: bread0/dcmt0
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt0
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0
          - device_handle: bread0/dcmt1
            function_name: set_mode
            args:
              mode: open_loop
          - device_handle: bread0/dcmt1
            function_name: set_open_loop
            args:
              motor1_pwm: 0
              motor2_pwm: 0

# Software safe-state for POST /v0/estop (anolis#219).
#
# DISTINCT from automation.mode_transition_hooks: those fire on MODE
# TRANSITIONS, this fires when the operator pulls the software e-stop. The
# runtime parses it independently of the automation section, so it works on the
# pure-manual variant too — which is the default install, and the one where a
# novice is most likely to reach for the e-stop.
#
# Without this block the ladder (hooks -> setpoints -> zero) finds every rung
# empty, reports software_safe_state "none", and /v0/estop latches without
# driving anything. Verified on pi-g1 2026-08-03: the impeller kept spinning
# straight through an e-stop press.
safety:
  safe_state:
    hooks:
      - device_handle: bread0/dcmt0
        function_name: set_mode
        args:
          mode: open_loop
      - device_handle: bread0/dcmt0
        function_name: set_open_loop
        args:
          motor1_pwm: 0
          motor2_pwm: 0
      - device_handle: bread0/dcmt1
        function_name: set_mode
        args:
          mode: open_loop
      - device_handle: bread0/dcmt1
        function_name: set_open_loop
        args:
          motor1_pwm: 0
          motor2_pwm: 0
      # NOT COVERED: the heater (bread0/rlht0).
      #
      # Its only CATEGORY_ACTUATE function is set_open_duty_pct, whose args are
      # uint64 — and a hook argument cannot be uint64 (anolishq/anolis#252): the
      # runtime parses every YAML integer to int64 and CallRouter type-checks
      # strictly, so the call is rejected at e-stop time even though the config
      # validates. Verified on pi-g1 2026-08-03:
      #     FAIL bread0/rlht0 set_open_duty_pct
      #          Argument 'duty1_pct': Type mismatch: expected uint64, got int64
      #
      # Add the two rlht0 calls (set_mode open_loop, then set_open_duty_pct 0/0 —
      # mode first, or a closed-loop PID keeps driving the relay) once #252 lands.
      # This rig has no heater load connected, so the gap is currently inert.

logging:
  level: info
