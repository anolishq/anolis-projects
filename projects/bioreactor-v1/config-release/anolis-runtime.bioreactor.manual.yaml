runtime:
  name: bioreactor-manual
  shutdown_timeout_ms: 3000
  startup_timeout_ms: 30000

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false

providers:
  - id: bread0
    command: /usr/local/bin/anolis-provider-bread
    args: ["--config", "projects/bioreactor-v1/config/provider-bread.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 2000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

  - id: ezo0
    command: /usr/local/bin/anolis-provider-ezo
    args: ["--config", "projects/bioreactor-v1/config/provider-ezo.bioreactor.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 5000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

polling:
  interval_ms: 2500

telemetry:
  enabled: false

automation:
  enabled: false

# Software safe-state for POST /v0/estop (anolis#219).
#
# DISTINCT from automation.mode_transition_hooks: those fire on MODE
# TRANSITIONS, this fires when the operator pulls the software e-stop. The
# runtime parses it independently of the automation section, so it works on the
# pure-manual variant too — which is the default install, and the one where a
# novice is most likely to reach for the e-stop.
#
# Without this block the ladder (hooks -> setpoints -> zero) finds every rung
# empty, reports software_safe_state "none", and /v0/estop latches without
# driving anything. Verified on pi-g1 2026-08-03: the impeller kept spinning
# straight through an e-stop press.
safety:
  safe_state:
    hooks:
      - device_handle: bread0/dcmt0
        function_name: set_mode
        args:
          mode: open_loop
      - device_handle: bread0/dcmt0
        function_name: set_open_loop
        args:
          motor1_pwm: 0
          motor2_pwm: 0
      - device_handle: bread0/dcmt1
        function_name: set_mode
        args:
          mode: open_loop
      - device_handle: bread0/dcmt1
        function_name: set_open_loop
        args:
          motor1_pwm: 0
          motor2_pwm: 0
      # The heater (bread0/rlht0): three calls, each one safe if another is
      # lost. set_setpoints 0/0 turns a closed-loop heater off on Slice_RLHT
      # firmware from 16a04dd on, where a setpoint <= 0 means off; on earlier
      # firmware the PID keeps its stored output term, so it does not reliably
      # zero the duty, and only the two calls after it do. Mode goes before
      # duty because the slice ignores set_open_duty_pct in closed loop. On
      # firmware with feastorg/Slice_RLHT#24, entering open loop zeroes both
      # on-times, so the relay stops at set_mode; on earlier firmware the
      # heater holds its last PID duty until the duty call lands. The
      # provider's retry does not cover a lost call: a write that fails once
      # and is retried is never applied (measured on the DCMT, which shares the
      # slice's CRUMBS receive path; anolishq/anolis-provider-bread#134). If
      # the slice drops off the bus, its command watchdog (command_watchdog_ms
      # in the provider config) opens both relays. A call reported OK is a
      # frame sent, not one applied, so read rlht0 back after an e-stop. The
      # zero setpoints persist: closed-loop heating does not resume until a
      # setpoint is set again. Needs anolis >= 0.1.41, which resolves uint64
      # hook arguments (anolishq/anolis#252).
      - device_handle: bread0/rlht0
        function_name: set_setpoints
        args:
          setpoint1_c: 0.0
          setpoint2_c: 0.0
      - device_handle: bread0/rlht0
        function_name: set_mode
        args:
          mode: open_loop
      - device_handle: bread0/rlht0
        function_name: set_open_duty_pct
        args:
          duty1_pct: 0
          duty2_pct: 0

logging:
  level: info
