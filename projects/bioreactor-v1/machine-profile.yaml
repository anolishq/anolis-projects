schema_version: 1
machine_id: bioreactor-v1
display_name: Bioreactor Lab Profile v1

runtime_profiles:
  manual: config/anolis-runtime.bioreactor.manual.yaml
  telemetry: config/anolis-runtime.bioreactor.telemetry.yaml
  automation: config/anolis-runtime.bioreactor.automation.yaml
  full: config/anolis-runtime.bioreactor.full.yaml

providers:
  bread0:
    config: config/provider-bread.bioreactor.yaml
    notes: "CRUMBS bus devices: rlht0 (0x13), dcmt0 (0x14), dcmt1 (0x15); gen1 boards, the RLHT has one relay (see README)"
  ezo0:
    config: config/provider-ezo.bioreactor.yaml
    notes: "EZO sensors: ph0 (0x63), do0 (0x61)"

behaviors:
  - behaviors/bioreactor_stir_dual_dosing.xml

# Required by the machine-profile schema; nothing acts on it. The versions
# install.sh installs are the release pins under components below.
compatibility:
  runtime:
    config_contract: "01-runtime-config"
    http_contract: "02-runtime-http"
  providers:
    bread0:
      strategy: pinned-ref
      version: "see components"
    ezo0:
      strategy: pinned-ref
      version: "see components"

safety:
  estop_topology: power_cut

# The workbench's operator panel (anolis 0.7.0+; start.require 0.8.0+;
# run, its label, require.when and actions 0.9.0+).
# Presentation only: the runtime does not read it. Parameters are the
# automation and full variants' automation.parameters.
operator:
  readings:
    - { signal: ezo0/ph0/ph_value, label: pH, decimals: 2 }
    - { signal: ezo0/do0/do_mg_l, label: Dissolved oxygen, unit: mg/L, decimals: 2 }
    # Only TC1 has a thermocouple fitted (see health.excluded_signals).
    - { signal: bread0/rlht0/t1_c, label: Temperature, unit: "°C", decimals: 1 }
  settings:
    - group: Stirring
      items:
        - { parameter: impeller_enable, label: "On" }
        - { parameter: impeller_pwm, label: Speed, unit: "/ 255" }
    - group: Dose 1
      items:
        - { parameter: dose1_enable, label: "On" }
        - { parameter: dose1_pwm, label: Pump speed, unit: "/ 255" }
        - { parameter: dose1_startup_delay_s, label: First dose after, unit: s }
        - { parameter: dose1_interval_s, label: Every, unit: s }
        - { parameter: dose1_pulse_s, label: For, unit: s }
        - { parameter: dose1_max_pulses_per_hour, label: Max doses per hour (0 = no limit) }
    - group: Dose 2
      items:
        - { parameter: dose2_enable, label: "On" }
        - { parameter: dose2_pwm, label: Pump speed, unit: "/ 255" }
        - { parameter: dose2_startup_delay_s, label: First dose after, unit: s }
        - { parameter: dose2_interval_s, label: Every, unit: s }
        - { parameter: dose2_pulse_s, label: For, unit: s }
        - { parameter: dose2_max_pulses_per_hour, label: Max doses per hour (0 = no limit) }
    - group: Sampler
      items:
        - { parameter: sample_enable, label: "On" }
        - { parameter: sample_pwm, label: Pump speed, unit: "/ 255" }
        - { parameter: sample_startup_delay_s, label: First sample after, unit: s }
        - { parameter: sample_interval_s, label: Every, unit: s }
        - { parameter: sample_pulse_s, label: For, unit: s }
        - { parameter: sample_request_delay_s, label: Sample now after, unit: s }
        - { parameter: sample_request_pulse_s, label: Sample now for, unit: s }
  # "Sample now" runs the sample pump once per press, beside the periodic
  # sampler (RequestedPulseWindow, anolis 0.9.0+).
  actions:
    # Checked at each press (anolis 0.10.0, workbench 0.30.0): the sample pump
    # refuses every pulse while its brake is engaged.
    - label: Sample now
      parameter: sample_requests
      require:
        - { signal: bread0/dcmt0/motor1_brake, equals: false, message: "Release the sample pump's brake" }
  run:
    label: Run
    start:
      enable: [impeller_enable, dose1_enable, dose2_enable, sample_enable]
      mode: AUTO
      # dcmt1 drives the dose pumps (ch1 dose 1, ch2 dose 2) and dcmt0 ch1
      # the sample pump. A pump whose brake is engaged refuses every pulse.
      require:
        - { signal: bread0/dcmt1/motor1_brake, equals: false, message: "Release dose pump 1's brake", when: dose1_enable }
        - { signal: bread0/dcmt1/motor2_brake, equals: false, message: "Release dose pump 2's brake", when: dose2_enable }
        - { signal: bread0/dcmt0/motor1_brake, equals: false, message: "Release the sample pump's brake", when: sample_enable }
    stop:
      disable: [impeller_enable, dose1_enable, dose2_enable, sample_enable]
      mode: IDLE

# Pinned artifact versions for bundle CI.
# Renovate auto-bumps these when upstream repos publish new releases.
components:
  runtime:
    repo: anolishq/anolis
    version: "0.10.1"
  providers:
    bread:
      repo: anolishq/anolis-provider-bread
      version: "0.10.0"
    ezo:
      repo: anolishq/anolis-provider-ezo
      version: "0.4.1"
  optional:
    telemetry_export:
      package: anolis-telemetry-export
      version: "0.2.0"
