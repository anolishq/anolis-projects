schema_version: 1
machine_id: bioreactor-v1
display_name: Bioreactor Lab Profile v1

runtime_profiles:
  manual: config/anolis-runtime.bioreactor.manual.yaml
  telemetry: config/anolis-runtime.bioreactor.telemetry.yaml
  automation: config/anolis-runtime.bioreactor.automation.yaml
  full: config/anolis-runtime.bioreactor.full.yaml

providers:
  bread0:
    config: config/provider-bread.bioreactor.yaml
    notes: "CRUMBS bus devices: rlht0 (0x13), dcmt0 (0x14), dcmt1 (0x15); gen1 boards, the RLHT has one relay (see README)"
  ezo0:
    config: config/provider-ezo.bioreactor.yaml
    notes: "EZO sensors: ph0 (0x63), do0 (0x61)"

behaviors:
  - behaviors/bioreactor_stir_dual_dosing.xml

# Required by the machine-profile schema; nothing acts on it. The versions
# install.sh installs are the release pins under components below.
compatibility:
  runtime:
    config_contract: "01-runtime-config"
    http_contract: "02-runtime-http"
  providers:
    bread0:
      strategy: pinned-ref
      version: "see components"
    ezo0:
      strategy: pinned-ref
      version: "see components"

safety:
  estop_topology: power_cut

# Pinned artifact versions for bundle CI.
# Renovate auto-bumps these when upstream repos publish new releases.
components:
  runtime:
    repo: anolishq/anolis
    version: "0.3.0"
  providers:
    bread:
      repo: anolishq/anolis-provider-bread
      version: "0.10.0"
    ezo:
      repo: anolishq/anolis-provider-ezo
      version: "0.4.1"
  optional:
    telemetry_export:
      package: anolis-telemetry-export
      version: "0.1.1"
