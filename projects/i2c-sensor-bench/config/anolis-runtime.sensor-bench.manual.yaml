runtime:
  name: i2c-sensor-bench-manual
  # Beside the config's directory: <prefix>/anolis-data once installed.
  data_dir: ../anolis-data
  shutdown_timeout_ms: 3000
  startup_timeout_ms: 30000

http:
  enabled: true
  bind: 127.0.0.1
  port: 8080
  cors_allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cors_allow_credentials: false

providers:
  - id: adafruit0
    # Frozen Python provider: install.sh puts it in <prefix>/bin.
    command: /opt/anolis/bin/anolis-provider-adafruit
    args: ["--config", "../anolis-projects/projects/i2c-sensor-bench/config/provider-adafruit.sensor-bench.yaml"]
    timeout_ms: 5000
    hello_timeout_ms: 5000
    ready_timeout_ms: 10000
    restart_policy:
      enabled: true
      max_attempts: 3
      backoff_ms: [200, 500, 1000]
      timeout_ms: 30000

polling:
  interval_ms: 1000

telemetry:
  enabled: false

automation:
  enabled: false

logging:
  level: info
