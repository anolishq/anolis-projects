schema_version: 1
machine_id: i2c-sensor-bench
display_name: I2C Sensor Bench

runtime_profiles:
  manual: config/anolis-runtime.sensor-bench.manual.yaml

providers:
  adafruit0:
    config: config/provider-adafruit.sensor-bench.yaml
    notes: "SHT31-D rh0 (0x44), LPS22 baro0 (0x5D), BMP390 baro1 (0x77), MPU-6050 imu0 (0x68)"

# Required by the machine-profile schema; nothing acts on it. The versions
# install.sh installs are the release pins under components below.
compatibility:
  runtime:
    config_contract: "01-runtime-config"
    http_contract: "02-runtime-http"
  providers:
    adafruit0:
      strategy: pinned-ref
      version: "see components"

components:
  runtime:
    repo: anolishq/anolis
    version: "0.12.0"
  providers:
    adafruit:
      repo: anolishq/anolis-provider-adafruit
      version: "0.3.0"
