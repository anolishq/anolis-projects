schema_version: 1
machine_id: i2c-sensor-bench
display_name: I2C Sensor Bench

runtime_profiles:
  manual: config/anolis-runtime.sensor-bench.manual.yaml

providers:
  adafruit0:
    config: config/provider-adafruit.sensor-bench.yaml
    notes: "SHT31-D rh0 (0x44), LPS22 baro0 (0x5D), BMP390 baro1 (0x77), MPU-6050 imu0 (0x68)"

# Required by the machine-profile schema; nothing acts on it. The versions
# install.sh installs are the release pins under components below.
compatibility:
  runtime:
    config_contract: "01-runtime-config"
    http_contract: "02-runtime-http"
  providers:
    adafruit0:
      strategy: pinned-ref
      version: "see components"

# The workbench's operator panel: one reading and sparkline per signal.
# Presentation only: the runtime does not read it.
operator:
  readings:
    - { signal: adafruit0/rh0/temperature, label: SHT31 temperature, unit: "°C", decimals: 2 }
    - { signal: adafruit0/rh0/relative_humidity, label: SHT31 humidity, unit: "%", decimals: 1 }
    - { signal: adafruit0/baro0/pressure, label: LPS22 pressure, unit: hPa, decimals: 2 }
    - { signal: adafruit0/baro0/temperature, label: LPS22 temperature, unit: "°C", decimals: 2 }
    - { signal: adafruit0/baro1/pressure, label: BMP390 pressure, unit: hPa, decimals: 2 }
    - { signal: adafruit0/baro1/temperature, label: BMP390 temperature, unit: "°C", decimals: 2 }
    - { signal: adafruit0/imu0/acceleration_x, label: MPU-6050 acceleration X, unit: "m/s²", decimals: 2 }
    - { signal: adafruit0/imu0/acceleration_y, label: MPU-6050 acceleration Y, unit: "m/s²", decimals: 2 }
    - { signal: adafruit0/imu0/acceleration_z, label: MPU-6050 acceleration Z, unit: "m/s²", decimals: 2 }
    - { signal: adafruit0/imu0/gyro_x, label: MPU-6050 gyro X, unit: rad/s, decimals: 3 }
    - { signal: adafruit0/imu0/gyro_y, label: MPU-6050 gyro Y, unit: rad/s, decimals: 3 }
    - { signal: adafruit0/imu0/gyro_z, label: MPU-6050 gyro Z, unit: rad/s, decimals: 3 }
    - { signal: adafruit0/imu0/temperature, label: MPU-6050 die temperature, unit: "°C", decimals: 1 }

components:
  runtime:
    repo: anolishq/anolis
    version: "0.15.0"
  providers:
    adafruit:
      repo: anolishq/anolis-provider-adafruit
      version: "0.3.0"
